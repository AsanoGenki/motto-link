<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motto Apps</title>
<style>
  :root { --bg:#f5efe2; --ink:#2b2b2b; --accent:#ea5b8c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans",sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:24px 16px; text-align:center; }
  .hidden { display:none !important; }
  #guide { position:fixed; inset:0; background:rgba(0,0,0,.88); color:#fff; display:flex;
           flex-direction:column; align-items:center; padding:150px 24px 24px; }
  .arrow { position:fixed; top:6px; right:14px; width:90px; height:90px; animation:bounce 1s ease-in-out infinite; }
  @keyframes bounce { 50% { transform:translate(6px,-8px); } }
  #guide h1 { font-size:26px; line-height:1.6; margin-bottom:28px; }
  #guide h1 b { color:#ffd84d; }
  .steps { text-align:left; font-size:18px; line-height:2; background:rgba(255,255,255,.1);
           border-radius:16px; padding:18px 22px; width:100%; max-width:360px; }
  .steps span { display:inline-block; width:28px; height:28px; border-radius:50%; background:#ffd84d; color:#222;
                text-align:center; line-height:28px; font-weight:700; margin-right:8px; font-size:15px; }
  .sub { margin-top:28px; font-size:14px; opacity:.7; line-height:1.7; }
  .btn { display:inline-block; margin-top:18px; padding:14px 26px; border-radius:999px; background:#fff;
         color:#222; text-decoration:none; font-weight:700; font-size:16px; }
  #normal p { margin-top:12px; }
  #normal a { color:var(--ink); }
</style>
</head>
<body>
  <div id="normal">
    <p>移動しています…</p>
    <p><a href="https://linktr.ee/motto_app">移動しない場合はこちら</a></p>
  </div>

  <div id="guide" class="hidden">
    <svg class="arrow" viewBox="0 0 100 100" fill="none" stroke="#ffd84d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 85 L80 22"/><path d="M42 20 H82 V60"/>
    </svg>
    <h1>右上の <b>「…」</b> をタップして<br><b>「ブラウザで開く」</b><br>を選んでね</h1>
    <div class="steps">
      <div><span>1</span>右上の「…」をタップ</div>
      <div><span>2</span>「ブラウザで開く」をタップ</div>
      <div><span>3</span>Safariでアプリを選ぶ</div>
    </div>
    <p class="sub">TikTokの中ではApp Storeが開けないため<br>Safariで開いてください</p>
    <a class="btn" id="safariBtn" href="#">Safariで開く</a>
  </div>

<script>
  var TARGET = 'https://linktr.ee/motto_app';
  var ua = navigator.userAgent || '';
  var isTikTok = /musical_ly|BytedanceWebview|TikTok|ByteLocale|trill/i.test(ua) || /[?&]tt=1/.test(location.search);
  if (isTikTok) {
    document.getElementById('normal').classList.add('hidden');
    document.getElementById('guide').classList.remove('hidden');
    document.getElementById('safariBtn').href = 'x-safari-' + TARGET;
  } else {
    location.replace(TARGET);
  }
</script>
</body>
</html>
